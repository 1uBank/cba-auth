name: CBA Auth dev ECS CI/CD Pipeline

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: cba-auth-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::612457065814:role/github-actions-deploy
  ECR_REPOSITORY: cba-core-dev-auth-api 
  LOADER_ECR_REPOSITORY: cba-core-dev-auth-realm-loader
  ECS_CLUSTER: cba-core-dev
  ECS_SERVICE: cba-core-dev-auth
  AUTH_TASK_FAMILY: cba-core-dev-auth
  AUTH_CONTAINER: cba-auth
  LOADER_TASK_FAMILY: cba-core-dev-auth-realm-loader
  LOADER_CONTAINER: realm-loader

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: providers/cba-core-user-migration/pom.xml

      - id: build
        name: Build and verify plugin
        run: mvn -B -f providers/cba-core-user-migration/pom.xml verify

  build-push:
    name: Build image and push to ECR
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image URI
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building image: $IMAGE"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy-to-ecs:
    name: Deploy to ECS
    needs: build-push
    runs-on: ubuntu-latest

    env:
      IMAGE: ${{ needs.build-push.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate deployment configuration
        run: |
          if [ -z "$IMAGE" ]; then
            echo "ERROR: Docker image URI is missing"
            exit 1
          fi

          if [ -z "$ECS_CONTAINER_NAME" ]; then
            echo "ERROR: ECS container name is missing"
            exit 1
          fi

      - name: Fetch current ECS task definition
        run: |
          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "ERROR: ECS service or task definition not found"
            exit 1
          fi

          echo "Current task definition: $TASK_DEFINITION_ARN"

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query 'taskDefinition' \
            --output json > task-definition-original.json

      - name: Update task definition image
        run: |
          jq -e --arg container "$ECS_CONTAINER_NAME" \
            'any(.containerDefinitions[]; .name == $container)' \
            task-definition-original.json > /dev/null || {
              echo "ERROR: Container $ECS_CONTAINER_NAME not found"
              exit 1
            }

          jq \
            --arg image "$IMAGE" \
            --arg container "$ECS_CONTAINER_NAME" \
            'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            ) |
            (.containerDefinitions[] |
              select(.name == $container).image) = $image' \
            task-definition-original.json > task-definition.json

          echo "Updated image: $IMAGE"

      - name: Register new ECS task definition
        id: task-definition
        run: |
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          if [ -z "$NEW_TASK_DEF_ARN" ] || [ "$NEW_TASK_DEF_ARN" = "None" ]; then
            echo "ERROR: Failed to register task definition"
            exit 1
          fi

          echo "task_definition_arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

          echo "New task definition: $NEW_TASK_DEF_ARN"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task-definition.outputs.task_definition_arn }}" \
            --force-new-deployment


     
